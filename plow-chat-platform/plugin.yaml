name: plow-chat-platform
label: Plow Chat
kind: platform
version: 2.0.0
description: >
  Plow Chat gateway adapter for Hermes Agent. Registers a Hermes platform named
  plow_chat backed by the Plow Chat REST API and a granted-scope WebSocket
  stream: chat membership comes from the credential's grants, not client-side
  configuration.
author: Plow / Hermes Agent seed
capabilities:
  - gateway.platform_actions
requires_env:
  - name: PLOW_AGENT_TOKEN
    description: "Chat-scoped agent bearer token minted by Plow"
    prompt: "Plow agent token"
    secret: true
    password: true
  - name: PLOW_HOME_CHANNEL
    description: "Home chat uid (cht_...) used for cron and default delivery"
    prompt: "Home chat uid"
    secret: false
    password: false
optional_env:
  - name: PLOW_API_BASE
    description: "API base URL (default: https://api.plow.co)"
    prompt: "Plow API base URL"
    secret: false
    password: false
  - name: PLOW_MCP_URL
    description: "Mac relay MCP URL; plow-init exports it when the account has a Mac. When set, the plugin adds the Latch routing section to the system prompt"
    prompt: "Plow Mac relay URL"
    secret: false
    password: false
